<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1a3d">
<title>Digital Passport · جواز السفر الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <circle cx="50" cy="50" r="46"/>
      <circle cx="50" cy="50" r="27"/>
      <ellipse cx="50" cy="50" rx="11" ry="27"/>
      <path d="M23 50h54M28 36h44M28 64h44"/>
      <ellipse cx="50" cy="50" rx="40" ry="14" transform="rotate(-28 50 50)" stroke-dasharray="3 5"/>
    </g>
  </symbol>
</svg>

<button id="langBtn" class="lang" type="button">EN</button>
<button id="outBtn" class="lang out" type="button" data-i="logout" hidden>تسجيل الخروج</button>
<button id="muteBtn" class="lang mute" type="button" aria-label="music">🔊</button>
<audio id="bgm" src="music.mp3" loop preload="none"></audio>

<main>
  <!-- Splash -->
  <section id="splash" class="screen active">
    <div class="cover">
      <p class="cover-top" data-i="title">جواز السفر الرقمي</p>
      <div class="seal"><svg><use href="#logo"/></svg><div class="orbit" aria-hidden="true"><svg class="plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div></div>
      <h1 data-i="tag">حول العالم في يوم واحد</h1>
      <div id="lmBox" class="lmbox" aria-hidden="true"></div>
      <button id="beginBtn" class="gold" type="button" data-i="begin">ابدأ الرحلة</button>
      <button id="haveBtn" class="ghost" type="button" data-i="have">عندي باسبور</button>
      <a class="ghost" href="admin.html" data-i="staff">دخول المنظمين</a>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </section>

  <!-- Registration -->
  <section id="register" class="screen">
    <form id="regForm" class="sheet" novalidate>
      <div class="mini"><svg><use href="#logo"/></svg></div>
      <h2 data-i="regTitle">سجّل بياناتك</h2>
      <label><span data-i="name">الاسم الكامل</span>
        <input id="fName" autocomplete="name" required></label>
      <label><span data-i="year">السنة الدراسية</span>
        <select id="fYear"></select></label>
      <label><span data-i="major">التخصص</span>
        <input id="fMajor" required></label>
      <label><span data-i="phone">رقم الموبايل</span>
        <input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" required></label>
      <p id="err" class="err" role="alert"></p>
      <button id="regBtn" class="gold" type="submit" data-i="issue">أصدر الباسبور</button>
    </form>
  </section>

  <!-- Existing passport login -->
  <section id="login" class="screen">
    <form id="loginForm" class="sheet" novalidate>
      <h2 data-i="loginTitle">افتح باسبورك</h2>
      <label><span data-i="phone">رقم الموبايل</span>
        <input id="lPhone" type="tel" inputmode="tel"></label>
      <p id="lErr" class="err" role="alert"></p>
      <button class="gold" type="submit" data-i="login">دخول</button>
      <button id="lBack" class="ghost" type="button" data-i="back">رجوع</button>
    </form>
  </section>

  <!-- Lucky wheel -->
  <section id="wheelScreen" class="screen">
    <div class="sheet" style="text-align:center">
      <h2 id="wTitle"></h2>
      <div class="wheelwrap"><canvas id="wheel"></canvas></div>
      <p id="wRes" class="result"></p>
      <button id="spinBtn" class="gold" type="button" data-i="spin">لف العجلة</button>
      <button id="wBack" class="ghost" type="button" data-i="back">رجوع</button>
    </div>
  </section>

  <!-- Passport -->
  <section id="passport" class="screen">
    <div class="sheet pass">
      <div class="pass-head">
        <div class="mini"><svg><use href="#logo"/></svg></div>
        <div>
          <p class="muted" data-i="pNo">رقم الباسبور</p>
          <p id="pId" class="pid">—</p>
        </div>
      </div>
      <p id="pName" class="pname"></p>
      <p id="pSub" class="muted"></p>
      <div class="rule"></div>
      <div class="row"><h3 data-i="stamps">الأختام</h3><span id="pCount" class="count">0/5</span></div>
      <ul id="slots" class="slots"></ul>
      <p id="hint" class="muted small"></p>
      <button id="drawBtn" class="gold" type="button" hidden></button>
      <button id="wheelBtn" class="gold" type="button" hidden></button>
      <p id="prize" class="result" hidden></p>
      <div id="special" class="special" hidden><div class="sp-emoji" aria-hidden="true">💛</div><p id="spText"></p></div>
      <div id="rate" class="rate" hidden>
        <div class="rule"></div>
        <h3 data-i="rateTitle">قيّم الـ event</h3>
        <div id="stars" class="stars">
          <button type="button" data-v="1" aria-label="1">★</button><button type="button" data-v="2" aria-label="2">★</button><button type="button" data-v="3" aria-label="3">★</button><button type="button" data-v="4" aria-label="4">★</button><button type="button" data-v="5" aria-label="5">★</button>
        </div>
        <textarea id="rateTxt" rows="3" maxlength="300" data-ph="ratePh"></textarea>
        <p id="rateErr" class="err" role="alert"></p>
        <button id="rateBtn" class="gold" type="button" data-i="rateSend">ارسل التقييم</button>
      </div>
      <p id="rated" class="result" data-i="rated" hidden>شكراً على تقييمك! ⭐</p>
      <div id="mem" class="rate" hidden>
        <div class="rule"></div>
        <h3 data-i="memTitle">📸 ذكرياتي</h3>
        <p class="muted small" data-i="memHint">الصور دي يشوفها إنت والمنظمين بس.</p>
        <div class="acts2">
          <button id="camBtn" class="gold" type="button" data-i="memCam">📷 التقط صورة</button>
          <button id="galBtn" class="ghost" type="button" data-i="memPick">🖼 اختر من المعرض</button>
        </div>
        <input id="camIn" type="file" accept="image/*" capture="environment" hidden>
        <input id="galIn" type="file" accept="image/*" hidden>
        <p id="memErr" class="err" role="alert"></p>
        <div id="gallery" class="album"></div>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <form id="pinForm" class="sheet" autocomplete="off">
    <h2 id="pinTitle"></h2>
    <input id="pinIn" class="pin" inputmode="numeric" maxlength="6" aria-label="PIN">
    <p id="pinErr" class="err" role="alert"></p>
    <button class="gold" type="submit" data-i="ok">تأكيد</button>
    <button id="pinCancel" class="ghost" type="button" data-i="cancel">إلغاء</button>
  </form>
</div>

<div id="lb" class="modal" hidden><img id="lbImg" alt="" style="max-width:100%;max-height:90vh;border-radius:12px"></div>

<script type="module" src="app.js"></script>
</body>
</html>
