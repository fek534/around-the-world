<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
main.adm{display:block;max-width:760px;margin:auto;padding:56px 16px 30px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.card{border:1px solid rgba(201,162,75,.5);border-radius:14px;padding:14px;background:var(--navy)}
.card b.n{display:block;font-size:2rem;color:var(--gold-2);line-height:1.1}
.card span{color:var(--muted);font-size:.9rem}
#q{margin:10px 0}
.st{margin-bottom:10px}
.st b{font-size:1.1rem}
.chips,.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.acts button{border:1px solid var(--gold);background:transparent;color:var(--paper);border-radius:999px;padding:6px 12px;font:600 .9rem "Cairo",sans-serif;cursor:pointer}
.chip{font-size:1.2rem;opacity:.4;filter:grayscale(1)}
.chip.on{opacity:1;filter:none;background:rgba(201,162,75,.2)}
.acts .del{border-color:var(--bad);color:var(--bad)}
.ph{display:block;margin-top:8px;direction:ltr;color:var(--gold-2)}
</style>
</head>
<body>
<button id="out" class="lang out" type="button">Log out</button>
<main class="adm">
  <h2>Admin · لوحة المنظمين</h2>
  <div class="grid" id="top"></div>
  <div class="grid" id="byc"></div>
  <input id="q" placeholder="Search name / passport / major · ابحث" autocomplete="off">
  <div id="list"></div>
</main>
<script type="module">
import { db, gate, logout, COUNTRIES, esc } from "./common.js";
import { collection, onSnapshot, doc, getDoc, updateDoc, writeBatch, arrayUnion, arrayRemove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
await gate();
const $ = (s) => document.querySelector(s);
$("#out").onclick = logout;
let rows = [];
const st = (x) => x.stamps || [];
const card = (n, l) => `<div class="card"><b class="n">${n}</b><span>${l}</span></div>`;

function renderStats() {
  $("#top").innerHTML = card(rows.length, "Registered") + card(rows.filter((x) => st(x).length === 5).length, "Completed 5 stamps")
    + card(rows.filter((x) => x.entered).length, "In the final draw") + card(rows.filter((x) => st(x).length > 0).length, "Got 1+ stamp");
  $("#byc").innerHTML = COUNTRIES.map((c) => card(rows.filter((x) => st(x).includes(c.id)).length, `${c.flag} ${c.en}`)).join("");
}
function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  let r = [...rows].sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  if (q) r = r.filter((x) => `${x.name} ${x.id} ${x.major}`.toLowerCase().includes(q));
  $("#list").innerHTML = r.slice(0, 30).map((x) => `<div class="card st" data-id="${esc(x.id)}">
    <b>${esc(x.name)}</b><br><span>${esc(x.id)} · ${esc(x.major)} · ${st(x).length}/5</span>
    <div class="chips">${COUNTRIES.map((c) => `<button class="chip ${st(x).includes(c.id) ? "on" : ""}" data-act="stamp" data-c="${c.id}" title="${c.en}">${c.flag}</button>`).join("")}</div>
    <div class="acts"><button data-act="entered">${x.entered ? "Remove from draw" : "Add to draw"}</button>
      <button data-act="phone">Phone</button><button class="del" data-act="del">Delete</button></div>
    <span class="ph"></span></div>`).join("");
}
onSnapshot(collection(db, "students"), (s) => { rows = s.docs.map((d) => ({ id: d.id, ...d.data() })); renderStats(); renderList(); },
  (e) => { $("#list").textContent = `Error: ${e.code}`; });
$("#q").addEventListener("input", renderList);

$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest("button"), box = e.target.closest(".st");
  if (!b || !box) return;
  const id = box.dataset.id, x = rows.find((r) => r.id === id), ref = doc(db, "students", id);
  try {
    if (b.dataset.act === "stamp") {
      const c = b.dataset.c, has = st(x).includes(c);
      await updateDoc(ref, has ? { stamps: arrayRemove(c), ...(x.entered ? { entered: false } : {}) } : { stamps: arrayUnion(c) });
    } else if (b.dataset.act === "entered") {
      await updateDoc(ref, { entered: !x.entered, enteredAt: serverTimestamp() });
    } else if (b.dataset.act === "phone") {
      const p = await getDoc(doc(db, "contacts", id));
      box.querySelector(".ph").textContent = p.exists() ? p.data().phone : "—";
    } else if (b.dataset.act === "del" && confirm(`Delete ${x.name} (${id})?`)) {
      const w = writeBatch(db);
      w.delete(ref); w.delete(doc(db, "contacts", id)); w.delete(doc(db, "draws", id));
      await w.commit();
    }
  } catch (err) { alert(err.code || err.message); }
});
</script>
</body>
</html>
